<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Drop Shadow -->
    <filter id="shadow" x="-12%" y="-10%" width="124%" height="128%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>

    <!-- Base Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="24" y="24" width="464" height="464" rx="108" ry="108"/>
    </clipPath>

    <!-- Metallic Base Gradient -->
    <linearGradient id="plateBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#edf0f5"/>
      <stop offset="70%" stop-color="#dbe1ea"/>
      <stop offset="100%" stop-color="#c7ced8"/>
    </linearGradient>

    <!-- Top Rim Light -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Tile Gradients -->
    <!-- Safari / Web -->
    <linearGradient id="gradSafari" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Calculator -->
    <linearGradient id="gradCalc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Messages -->
    <linearGradient id="gradMsg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Music -->
    <linearGradient id="gradMusic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Notes -->
    <linearGradient id="gradNotes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="gradNotesHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Mail -->
    <linearGradient id="gradMail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Settings -->
    <linearGradient id="gradSettings" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Maps Tile Clip -->
    <clipPath id="mapsClip">
      <rect x="212" y="324" width="88" height="88" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- Shadow Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" filter="url(#shadow)" fill="#c7ced8"/>

  <g clip-path="url(#squircleClip)">
    <!-- Brushed Aluminum Surface -->
    <rect x="24" y="24" width="464" height="464" fill="url(#plateBg)"/>

    <!-- Subtle diagonal luster sheen -->
    <path d="M 24,24 L 380,24 L 24,380 Z" fill="#ffffff" opacity="0.22"/>
    <path d="M 488,140 L 488,488 L 140,488 Z" fill="#000000" opacity="0.04"/>

    <!-- Inner Border Stroke -->
    <rect x="25" y="25" width="462" height="462" rx="107" ry="107" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

    <!-- ==================== 3x3 APP GRID ==================== -->

    <!-- ================= ROW 0 ================= -->

    <!-- TILE (0,0): Safari / Compass -->
    <g>
      <rect x="100" y="104" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <rect x="100" y="100" width="88" height="88" rx="20" fill="url(#gradSafari)"/>
      <rect x="100.5" y="100.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
      <!-- Compass Dial -->
      <circle cx="144" cy="144" r="26" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.9"/>
      <!-- Dial ticks -->
      <line x1="144" y1="120" x2="144" y2="124" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="144" y1="164" x2="144" y2="168" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="120" y1="144" x2="124" y2="144" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="164" y1="144" x2="168" y2="144" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Needle rotated 45 deg -->
      <g transform="translate(144, 144) rotate(45)">
        <polygon points="0,-20 4.5,0 0,0 -4.5,0" fill="#ff3b30"/>
        <polygon points="0,-20 0,0 4.5,0" fill="#dc2626"/>
        <polygon points="0,20 4.5,0 0,0 -4.5,0" fill="#ffffff"/>
        <polygon points="0,20 0,0 4.5,0" fill="#e2e8f0"/>
        <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
        <circle cx="0" cy="0" r="1.5" fill="#dc2626"/>
      </g>
    </g>

    <!-- TILE (0,1): Calculator -->
    <g>
      <rect x="212" y="104" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <rect x="212" y="100" width="88" height="88" rx="20" fill="url(#gradCalc)"/>
      <rect x="212.5" y="100.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
      <!-- 2x2 Math Symbols -->
      <!-- Plus -->
      <path d="M 235,130 H 245 M 240,125 V 135" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Minus -->
      <path d="M 267,130 H 277" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Multiply -->
      <path d="M 236.5,154.5 L 243.5,161.5 M 243.5,154.5 L 236.5,161.5" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Equals -->
      <path d="M 267,155.5 H 277 M 267,160.5 H 277" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    </g>

    <!-- TILE (0,2): Photos / Rainbow Wheel -->
    <g>
      <rect x="324" y="104" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <rect x="324" y="100" width="88" height="88" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="324.5" y="100.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
      <!-- 8 Petals Wheel centered at (368, 144) -->
      <g transform="translate(368, 144)">
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#ef4444" opacity="0.85" transform="rotate(0)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#f97316" opacity="0.85" transform="rotate(45)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#eab308" opacity="0.85" transform="rotate(90)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#22c55e" opacity="0.85" transform="rotate(135)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#06b6d4" opacity="0.85" transform="rotate(180)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#3b82f6" opacity="0.85" transform="rotate(225)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#6366f1" opacity="0.85" transform="rotate(270)"/>
        <ellipse cx="0" cy="-14" rx="6" ry="11" fill="#a855f7" opacity="0.85" transform="rotate(315)"/>
        <circle cx="0" cy="0" r="5.5" fill="#ffffff" opacity="0.95"/>
      </g>
    </g>

    <!-- ================= ROW 1 ================= -->

    <!-- TILE (1,0): Messages -->
    <g>
      <rect x="100" y="216" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <rect x="100" y="212" width="88" height="88" rx="20" fill="url(#gradMsg)"/>
      <rect x="100.5" y="212.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
      <!-- Speech bubble centered at (144, 256) -->
      <path d="M 144,235 C 127,235 113,246 113,259 C 113,267 118,274 126,278 L 124,288 C 123.8,289.1 125,290 126.1,289.4 L 138,282.8 C 140,283.3 142,283.5 144,283.5 C 161,283.5 175,272.5 175,259 C 175,246 161,235 144,235 Z" fill="#ffffff"/>
    </g>

    <!-- TILE (1,1): Music -->
    <g>
      <rect x="212" y="216" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <rect x="212" y="212" width="88" height="88" rx="20" fill="url(#gradMusic)"/>
      <rect x="212.5" y="212.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
      <!-- Beamed notes centered at (256, 256) -->
      <g>
        <ellipse cx="244" cy="272" rx="7" ry="5.5" transform="rotate(-20 244 272)" fill="#ffffff"/>
        <ellipse cx="268" cy="265" rx="7" ry="5.5" transform="rotate(-20 268 265)" fill="#ffffff"/>
        <rect x="248.5" y="240" width="3.5" height="32" fill="#ffffff"/>
        <rect x="272.5" y="233" width="3.5" height="32" fill="#ffffff"/>
        <polygon points="248.5,240 276,233 276,241 248.5,248" fill="#ffffff"/>
      </g>
    </g>

    <!-- TILE (1,2): Notes -->
    <g>
      <rect x="324" y="216" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <rect x="324" y="212" width="88" height="88" rx="20" fill="url(#gradNotes)"/>
      <rect x="324.5" y="212.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      <!-- Header Band -->
      <path d="M 324,232 C 324,221 333,212 344,212 L 392,212 C 403,212 412,221 412,232 L 412,238 L 324,238 Z" fill="url(#gradNotesHeader)"/>
      <line x1="324" y1="238" x2="412" y2="238" stroke="#a16207" stroke-width="1.5"/>
      <!-- Ruled Lines -->
      <line x1="340" y1="251" x2="396" y2="251" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
      <line x1="340" y1="263" x2="396" y2="263" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
      <line x1="340" y1="275" x2="396" y2="275" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
      <line x1="340" y1="287" x2="376" y2="287" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- ================= ROW 2 ================= -->

    <!-- TILE (2,0): Mail -->
    <g>
      <rect x="100" y="328" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <rect x="100" y="324" width="88" height="88" rx="20" fill="url(#gradMail)"/>
      <rect x="100.5" y="324.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
      <!-- White Envelope centered at (144, 368) -->
      <rect x="120" y="352" width="48" height="32" rx="4" fill="#ffffff"/>
      <path d="M 120,353 L 144,369 L 168,353" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="121" y1="383" x2="134" y2="372" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
      <line x1="167" y1="383" x2="154" y2="372" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- TILE (2,1): Maps -->
    <g>
      <rect x="212" y="328" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <g clip-path="url(#mapsClip)">
        <rect x="212" y="324" width="88" height="88" fill="#f1f5f9"/>
        <!-- Green Park Area -->
        <path d="M 212,324 L 272,324 L 254,366 L 212,366 Z" fill="#bbf7d0"/>
        <!-- Water Blue Area -->
        <path d="M 276,412 L 300,412 L 300,380 L 266,412 Z" fill="#bae6fd"/>
        <!-- Curved Highway Route -->
        <path d="M 216,408 C 235,385 240,368 256,356 C 272,344 286,336 300,332" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        <path d="M 216,408 C 235,385 240,368 256,356 C 272,344 286,336 300,332" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
        <!-- Location Pin at (256, 356) -->
        <path d="M 256,346 C 250.5,346 246,350.5 246,356 C 246,364 256,375 256,375 C 256,375 266,364 266,356 C 266,350.5 261.5,346 256,346 Z" fill="#ef4444"/>
        <circle cx="256" cy="354" r="3.5" fill="#ffffff"/>
      </g>
      <rect x="212.5" y="324.5" width="87" height="87" rx="19.5" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- TILE (2,2): Settings / Gear -->
    <g>
      <rect x="324" y="328" width="88" height="88" rx="20" fill="#0f172a" opacity="0.18"/>
      <rect x="324" y="324" width="88" height="88" rx="20" fill="url(#gradSettings)"/>
      <rect x="324.5" y="324.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.35"/>
      <!-- Precision Gear at (368, 368) -->
      <g transform="translate(368, 368)">
        <rect x="-5" y="-23" width="10" height="46" rx="2.5" fill="#ffffff"/>
        <rect x="-23" y="-5" width="46" height="10" rx="2.5" fill="#ffffff"/>
        <rect x="-5" y="-23" width="10" height="46" rx="2.5" fill="#ffffff" transform="rotate(45)"/>
        <rect x="-23" y="-5" width="46" height="10" rx="2.5" fill="#ffffff" transform="rotate(45)"/>
        <circle cx="0" cy="0" r="18" fill="#ffffff"/>
        <circle cx="0" cy="0" r="13.5" fill="#e2e8f0"/>
        <circle cx="0" cy="0" r="6.5" fill="#475569"/>
      </g>
    </g>

    <!-- Outer Rim Highlight -->
    <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#rimLight)" stroke-width="3"/>
  </g>
</svg>